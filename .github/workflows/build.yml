name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Check Firebase config
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. The Google Services plugin requires it."
            exit 1
          fi
          echo "google-services.json found"

      - name: Ensure firebase_options.dart exists
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "firebase_options.dart missing, creating fallback..."
            mkdir -p lib
            cat > lib/firebase_options.dart << 'EOF'
          // Fallback generated in CI - commit real file to repo for proper config
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) throw UnsupportedError('web not configured');
              switch (defaultTargetPlatform) {
                case TargetPlatform.android: return android;
                case TargetPlatform.iOS: return ios;
                default: throw UnsupportedError('platform not supported');
              }
            }
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyAbojK0DyPt89E9ah54tgXfyXN5lLrcv44',
              appId: '1:812588965409:android:6717adcf62604ea0b88d60',
              messagingSenderId: '812588965409',
              projectId: 'kats-chat',
              storageBucket: 'kats-chat.firebasestorage.app',
            );
            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'AIzaSyAbojK0DyPt89E9ah54tgXfyXN5lLrcv44',
              appId: '1:812588965409:ios:placeholder',
              messagingSenderId: '812588965409',
              projectId: 'kats-chat',
              storageBucket: 'kats-chat.firebasestorage.app',
              iosBundleId: 'com.tauseef.whatsappclone',
            );
          }
          EOF
            cat lib/firebase_options.dart
          else
            echo "firebase_options.dart exists"
          fi

      - name: Create debug keystore for CI if missing
        run: |
          if [ ! -f android/key.properties ]; then
            echo "No key.properties found, generating debug keystore for CI..."
            keytool -genkey -v -keystore android/app/debug-ci.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=debug-ci.keystore\n" > android/key.properties
          else
            echo "key.properties exists"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=HTTPSMS_API_KEY=${{ secrets.HTTPSMS_API_KEY }} --dart-define=HTTPSMS_GATEWAY=${{ secrets.HTTPSMS_GATEWAY }} --dart-define=R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }} --dart-define=R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }} --dart-define=R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }} --dart-define=R2_BUCKET=${{ secrets.R2_BUCKET }} --dart-define=R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }} --dart-define=R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kats-chat-app
          path: build/app/outputs/flutter-apk/*.apk
